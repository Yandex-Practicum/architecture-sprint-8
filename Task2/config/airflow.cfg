[core]
executor = LocalExecutor
load_examples = False
dags_are_paused_at_creation = False
donot_pickle = True

[database]
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow

[logging]
logging_level = INFO

[webserver]
rbac = True

[api]
auth_backends = airflow.api.auth.backend.basic_auth