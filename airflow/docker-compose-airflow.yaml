version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.0-python3.9
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW_CONN_TELEMETRY_DB: postgresql://telemetry_user:telemetry_password@telemetry_db:5432/telemetry_db
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "9000"
    CLICKHOUSE_HTTP_PORT: "8123"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
  depends_on:
    - airflow_db
  networks:
    - bionicpro-network

services:
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - ./postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - bionicpro-network

  airflow_webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    environment:
      <<: *airflow-common-env

  airflow_scheduler:
    <<: *airflow-common
    command: scheduler

networks:
  bionicpro-network:
    external: true
