server:
  port: 8181

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bionicpro_auth}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bionicpro-auth
            # Секрет только на сервере BFF. PKCE включается в OAuth2PkceClientConfig (см. атрибут клиента в Keycloak).
            client-secret: ${KEYCLOAK_CLIENT_SECRET:bionicpro-auth-secret-change-in-prod}
            client-authentication-method: client_secret_post
            # offline_access убран: при частых not_allowed на code→token мешает проверка consent для offline в некоторых конфигурациях.
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI:${KEYCLOAK_PROVIDER_AUTHORIZATION_URI:http://localhost:8080/realms/reports-realm/protocol/openid-connect/auth}}
            token-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI:${KEYCLOAK_PROVIDER_TOKEN_URI:http://localhost:8080/realms/reports-realm/protocol/openid-connect/token}}
            user-info-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI:${KEYCLOAK_PROVIDER_USER_INFO_URI:http://localhost:8080/realms/reports-realm/protocol/openid-connect/userinfo}}
            jwk-set-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI:${KEYCLOAK_PROVIDER_JWK_SET_URI:http://localhost:8080/realms/reports-realm/protocol/openid-connect/certs}}
            user-name-attribute: preferred_username

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  reports-service-base-url: ${REPORTS_SERVICE_BASE_URL:http://localhost:8082}
  cdn-proxy-target-url: ${APP_CDN_PROXY_TARGET:http://localhost:9000/reports}
  session-cookie-name: BIONIC_SESSION
  session-max-age-seconds: 1800
  cookie-secure: ${APP_COOKIE_SECURE:false}
  encryption-secret: ${APP_ENCRYPTION_SECRET:dev-only-encryption-secret-min-16-chars!!}
