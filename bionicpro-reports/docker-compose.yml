version: '3.8'
name: bionicpro-reports-compose

services:

  bionicpro-reports:
    image: ${DOCKER_REGISTRY-}bionicproreports
    container_name: bionicpro-reports
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    volumes:
      - shared-auth-keys:/app/shared-auth-keys
    ports:
      - "7001:8080"
    build:
      context: .
      dockerfile: bionicpro-reports/Dockerfile
    networks:
      - bionicpro-network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"       
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    networks:
      - bionicpro-network
    volumes:
      - minio-data:/data

networks:
  bionicpro-network:
    driver: bridge

volumes:
  shared-auth-keys:
  minio-data:

