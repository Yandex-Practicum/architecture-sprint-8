# Эмуляция CDN: reverse proxy к MinIO (S3) с дисковым кешем ответов.
# Инвалидация: в имени объекта S3 участвует data_through_date от ETL — новый срез = новый URL, старые ключи отваливаются по inactive.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    proxy_cache_path /var/cache/nginx/reports
        levels=1:2
        keys_zone=report_cache:20m
        max_size=2g
        inactive=30d
        use_temp_path=off;

    upstream minio_s3 {
        server minio:9000;
        keepalive 16;
    }

    server {
        listen 8090;
        server_name _;

        # GET /reports/<s3-key-relative> → MinIO path-style /bionicpro-reports/<key>
        location /reports/ {
            proxy_cache report_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            add_header X-Cache-Status $upstream_cache_status always;

            rewrite ^/reports/(.*)$ /bionicpro-reports/$1 break;
            proxy_pass http://minio_s3;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        location /health {
            default_type text/plain;
            return 200 'cdn-ok';
        }
    }
}
