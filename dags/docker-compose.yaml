x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor #локальный запуск
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # DAG использует postgres_conn_id=write_to_postgres → БД sample (см. db/*.sql)
    AIRFLOW_CONN_WRITE_TO_POSTGRES: postgresql://airflow:airflow@postgres:5432/sample
    # Меньше воркеров — меньше шанс OOM и «зависания» UI/логов в Docker Desktop
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'your_airflow_webserver_sec_key'
    _PIP_ADDITIONAL_REQUIREMENTS: ''
    AIRFLOW_INPUT_DIR: '/opt/airflow/dag-inputs'
    # Не тянуть запросы к ClickHouse/Postgres через корпоративный прокси с хоста (urllib + gaierror)
    NO_PROXY: '127.0.0.1,localhost,clickhouse,postgres'
    # HTTP — из DAG; native 9000 не используется в коде
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: '9000'
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: bionicpro_local
    # Опционально полный URL, если имя clickhouse не резолвится (редко)
    # CLICKHOUSE_HTTP_URL: http://clickhouse:8123
  volumes:
    # compose-файл лежит в этой же папке — монтируем текущий каталог, а не несуществующий ./dags
    - .:/opt/airflow/dags
    - ./sql:/opt/airflow/dags/sql
    - ./requirements.txt:/opt/airflow/requirements.txt
    - ./data:/opt/airflow/sample_files
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      # См. https://clickhouse.com/docs/install/docker — без DEFAULT_ACCESS_MANAGEMENT
      # пользователь/пароль для сети могут не примениться, healthcheck и Airflow падают.
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: bionicpro_local
    networks:
      - dag_sample
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # HTTP + пароль (как в доке); clickhouse-client внутри контейнера часто расходится с темой пароля на томе
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:8123/?password=bionicpro_local&query=SELECT%201' | grep -q 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:16.0
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - airflow
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - dag_sample

  airflow-webserver:
    <<: *airflow-common

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    networks:
      - dag_sample
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Общий network namespace с ClickHouse: HTTP на 127.0.0.1:8123 без DNS (Colima и т.п.).
  # Имя postgres по-прежнему резолвится — то же бридж-соединение, что у контейнера clickhouse.
  airflow-scheduler:
    <<: *airflow-common
    network_mode: service:clickhouse
    environment:
      <<: *airflow-common-env
      CLICKHOUSE_HOST: "127.0.0.1"
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      # hostname = как у «основного» контейнера (clickhouse), не $HOSTNAME
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$$(hostname)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    <<: *airflow-common
    hostname: airflow-triggerer
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - dag_sample
    command: bash -c "airflow triggerer"
    healthcheck:
      test:
        - CMD-SHELL
        # ${HOSTNAME} в compose подставляется с хоста и даёт пустую строку — фиксируем имя job
        - airflow jobs check --job-type TriggererJob --hostname airflow-triggerer
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-cli:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dag_sample
    profiles:
      - debug
    command:
      - bash
      - -c
      - airflow

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email admin@sample.ru \
          --password admin || true
    networks:
      - dag_sample

networks:
  dag_sample:
