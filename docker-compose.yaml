version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8081/api
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    container_name: bionicpro-auth
    ports:
      - "8081:8081"
    environment:
      - KEYCLOAK_BACKEND_URL=http://keycloak:8080/realms/reports-realm
      - KEYCLOAK_FRONTEND_URL=http://localhost:8080/realms/reports-realm
      - CLIENT_ID=reports-frontend
      - REDIRECT_URI=http://localhost:8081/callback
      - FRONTEND_URL=http://localhost:3000
      - API_URL=http://bionicpro-api:8000
    depends_on:
      - keycloak
    restart: unless-stopped
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    ports:
      - "389:389"
    environment:
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_DOMAIN: "example.com"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
  bionicpro-api:
    build:
      context: ./bionicpro-api
      dockerfile: Dockerfile
    container_name: bionicpro-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080/realms/reports-realm
    depends_on:
      - keycloak