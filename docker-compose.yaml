services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_VITE_API_URL: https://api.bio-pro.local:444
      REACT_APP_VITE_API_TIMEOUT: 30000


  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    environment:
      Keycloak__realm: reports-realm
      Keycloak__auth-server-url: http://keycloak:8080
      Keycloac__credentionals__client-id: reports-frontend
      Keycloac__credentionals__secret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq



  nginx:
    image: nginx:latest
    container_name: web_nginx
    depends_on:
      - frontend
      - bionicpro-auth
    volumes:
      - ./nginx/Docker.nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/certs:ro
    ports:
      - 444:444
    restart: always


