version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db

  # Session / token store for bionicpro-auth (Задача 3)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # New backend auth-service (Задача 3)
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      # Keycloak connection
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      # Session store
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Cookie settings (для локалки Secure=false, в проде будет true)
      COOKIE_NAME: bpsid
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
    depends_on:
      - keycloak
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Важно: фронт теперь ходит в bionicpro-auth (сессии/куки), а не в старый API
      REACT_APP_API_URL: http://localhost:8001
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    depends_on:
      - bionicpro-auth
