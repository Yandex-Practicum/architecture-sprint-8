version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  openldap:
    build:
      context: ./ldap
      dockerfile: Dockerfile
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: bionicpro.com
      LDAP_ADMIN_PASSWORD: ldap_admin_password
      LDAP_TLS: "false"
    ports:
      - "389:389"

  ldap-seed:
    build:
      context: ./ldap
      dockerfile: seed.Dockerfile
    environment:
      LDAP_ADMIN_PASSWORD: ldap_admin_password
    depends_on:
      - openldap
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
      - ldap-seed

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      LISTEN: ":8443"
      FRONT_URL: http://localhost:3000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      AUTH_CALLBACK_URL: http://localhost:8443/auth/callback
      SESSION_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      API_URL: http://reports-api:8000
    ports:
      - "8443:8443"
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8443

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: bionicpro_dm
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
    ports:
      - "9042:9042"

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      LISTEN: ":8000"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: bionicpro_dm
      QUERY_TIMEOUT: 10s
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: prosthesis-reports
      S3_USE_SSL: "false"
      S3_REGION: us-east-1
      CDN_BASE_URL: http://localhost:8081
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      nginx-cdn:
        condition: service_started

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio'; sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/prosthesis-reports;
      /usr/bin/mc anonymous set download local/prosthesis-reports;
      echo 'bucket ready';
      "
    restart: "no"

  nginx-cdn:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-cdn/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
    ports:
      - "8081:80"

  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_REPLICATION_MODE: logical
      POSTGRES_REPLICATION_USER: crm_repl
      POSTGRES_REPLICATION_PASSWORD: crm_repl_password
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    volumes:
      - ./crm/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - crm-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    expose:
      - "9092"
      - "9093"

  debezium-connect:
    image: debezium/connect:2.6
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: crm-cdc
      CONFIG_STORAGE_TOPIC: cdc_configs
      OFFSET_STORAGE_TOPIC: cdc_offsets
      STATUS_STORAGE_TOPIC: cdc_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_started
      crm_db:
        condition: service_healthy
    volumes:
      - ./crm/debezium-connector.json:/config/connector.json:ro
    ports:
      - "8083:8083"

  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      debezium-connect:
        condition: service_started
    volumes:
      - ./crm/debezium-connector.json:/config/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for Debezium Connect...';
        for i in $$(seq 1 60); do
          if wget -q -O- http://debezium-connect:8083/connectors >/dev/null 2>&1; then
            echo 'Debezium is up';
            break;
          fi;
          sleep 2;
        done;
        echo 'Registering connector...';
        HTTP_CODE=$$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
          -H 'Content-Type: application/json' \
          --data @/config/connector.json \
          http://debezium-connect:8083/connectors);
        echo "HTTP $$HTTP_CODE";
        cat /tmp/resp;
        echo;
    restart: "no"

volumes:
  clickhouse-data:
  cassandra-data:
  minio-data:
  crm-db-data: