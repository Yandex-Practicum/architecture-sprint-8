services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bionic-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8089:8080"
    depends_on:
      - keycloak_db
      - openldap
    networks:
      - bionic-network

  openldap:
    image: osixia/openldap:1.5.0
    container_name: bionicpro-ldap
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: "Example Company"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/01-bootstrap.ldif
    networks:
      - bionic-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bionic-network
    restart: unless-stopped

  bionicpro-auth:
    build:
      context: ./microservices/bionicpro-auth-api
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - Redis__ConnectionString=redis:6379
      - Keycloak__AuthServerUrl=http://keycloak:8089
      - Keycloak__Realm=reports-realm
      - Keycloak__ClientId=reports-frontend
    depends_on:
      - redis
      - keycloak
    networks:
      - bionic-network
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://bionicpro-auth:80
      REACT_APP_KEYCLOAK_URL: http://keycloak:8089
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    depends_on:
      - keycloak
      - bionicpro-auth
    networks:
      - bionic-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./db/init-clickhouse-db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    networks:
      - bionic-network
    restart: unless-stopped

  report-service:
    build:
      context: ./microservices/report-service
      dockerfile: Dockerfile
    container_name: report-service
    ports:
      - "8086:8086"
    environment:
      - ASPNETCORE_URLS=http://+:8086
      - ConnectionStrings__ClickHouse=Host=clickhouse;Port=8123;Database=bionicpro;User=report;Password=report;
      - Auth__Authority=http://keycloak:8089/realms/reports-realm
      - S3__ServiceURL=http://minio:9000
      - S3__AccessKey=minioadmin
      - S3__SecretKey=minioadmin
      - S3__BucketName=bionicpro-reports
    depends_on:
      - clickhouse
      - keycloak
      - minio
    networks:
      - bionic-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - bionic-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/bionicpro-reports ||
      exit 0
      "
    networks:
      - bionic-network

  nginx-cdn:
    image: nginx:alpine
    container_name: nginx-cdn
    ports:
      - "8087:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache:/var/cache/nginx
    networks:
      - bionic-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-keycloak-data:
  clickhouse_data:

networks:
  bionic-network:
    driver: bridge