#version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password123
    volumes:
      - ch_data:/var/lib/clickhouse

  airflow:
    image: apache/airflow:2.7.1-python3.10
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://keycloak_user:keycloak_password@keycloak_db:5432/keycloak_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements.txt:/requirements.txt
    ports:
      - "8081:8080"
    command: ["bash", "-c", "pip install --no-cache-dir -r /requirements.txt && airflow standalone"]
    depends_on:
      - keycloak_db
      - clickhouse
  backend-reports:
    build:
      context: ./backend-reports #путь
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
        #откуда брать ключ для проверки JWT.
        #в реальном приложении это будет URL Keycloak /certs,
        # но для простоты можно использовать статичный ключ, если вы доверяете Keycloak
      KEYCLOAK_PUBLIC_KEY: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
        #URL Keycloak для получения публичных ключей (по необходимости)
      KEYCLOAK_CERTS_URL: "http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs"
    depends_on:
      - clickhouse 
      - keycloak  
    volumes:
        - ./backend-reports:/app
volumes:
  ch_data:
