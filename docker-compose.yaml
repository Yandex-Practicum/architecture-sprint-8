  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      test: [ "CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=example,dc=com -D 'cn=admin,dc=example,dc=com' -w admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  crm_db:
    image: postgres:14
    container_name: crm_db
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
        - ./crm-db:/docker-entrypoint-initdb.d
        - postgres_crm_data:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  olap_db:
    image: clickhouse/clickhouse-server:latest
    container_name: olap_db
    ports:
      - "8123:8123"
      - "9431:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./olap-db:/docker-entrypoint-initdb.d
      - ./olap-db:/var/lib/clickhouse/user_files
      - ./olap-db/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data
volumes:
  minio_storage: {}
  redis_data: {}
  postgres_keycloak_data: {}
  postgres_crm_data: {}
  clickhouse_data: {}
