services:
  # === СУЩЕСТВУЮЩИЕ СЕРВИСЫ ===
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bionicpro

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - bionicpro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    depends_on:
      - keycloak
    networks:
      - bionicpro

  # === СЕРВИСЫ ДЛЯ ЗАДАНИЯ 2 (ОТЧЁТЫ) ===

  postgres_app:
    image: postgres:14
    container_name: postgres_app
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionic_user
      POSTGRES_PASSWORD: bionic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
      - ./init_pg.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bionicpro

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: secret
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init_ch.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bionicpro

  airflow_db:
    image: postgres:14
    container_name: airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bionicpro

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      - _PIP_ADDITIONAL_REQUIREMENTS=clickhouse-connect
    depends_on:
      airflow_db:
        condition: service_healthy
    networks:
      - bionicpro
    command: >
      bash -c "
      echo 'Running DB migrate...' &&
      airflow db migrate &&
      echo 'Creating admin user...' &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "

  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=578a-tMS9ZcBowGZgJTuFNwdC6IAQky3TI7M7yc8-3U=
      - AIRFLOW__WEBSERVER__SECRET_KEY=supersecretkey
      - _PIP_ADDITIONAL_REQUIREMENTS=clickhouse-connect
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres_app:
        condition: service_started
      clickhouse:
        condition: service_started
    networks:
      - bionicpro
    command: >
      bash -c "
      echo 'Starting scheduler and webserver...' &&
      airflow scheduler &
      airflow webserver
      "
      
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: report-service
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=secret
      - CLICKHOUSE_DB=bionicpro
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=reports-realm
      - KEYCLOAK_CLIENT_ID=reports-frontend
    depends_on:
      - clickhouse
      - keycloak
    networks:
      - bionicpro

volumes:
  postgres-keycloak-data:
  postgres-app-data:
  clickhouse_data:

networks:
  bionicpro:
    driver: bridge