services:
  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    ports:
      - "389:389"
    env_file:
      - .env
    networks:
      - bionic-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/no_password.xml:/etc/clickhouse-server/users.d/no_password.xml:ro
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - bionic-net

  airflow:
    build: ./airflow
    container_name: airflow
    depends_on:
      - clickhouse
    env_file:
      - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
      - airflow_data:/opt/airflow
    ports:
      - "8081:8080"
    command: >
      bash -c "
        pip install --user clickhouse-driver &&
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com 2>/dev/null || true &&
        airflow webserver -p 8080 &
        airflow scheduler
      "
    networks:
      - bionic-net

  keycloak_db:
    image: postgres:14
    env_file:
      - .env
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    networks:
      - bionic-net

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    env_file:
      - .env
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - bionic-net

  reports_api:
    build: ./reports_api
    container_name: reports_api
    env_file:
      - .env
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=reports
    ports:
      - "${REPORTS_API_PORT:-8000}:8000"
    volumes:
      - ./reports_api/app:/app/app
    depends_on:
      - clickhouse
      - keycloak
    networks:
      - bionic-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - keycloak
      - reports_api
    networks:
      - bionic-net

volumes:
  postgres-keycloak-data:
  airflow_data:

networks:
  bionic-net:
    driver: bridge