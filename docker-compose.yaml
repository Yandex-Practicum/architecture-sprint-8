services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  crm-db:
    image: postgres:14
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./crm/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
  telemetry-db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    volumes:
      - telemetry-db-data:/var/lib/postgresql/data
      - ./telemetry/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5435:5432"
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: reporting
      CLICKHOUSE_USER: report_user
      CLICKHOUSE_PASSWORD: report_password
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
  clickhouse-apply-schema:
    image: clickhouse/clickhouse-server:24.8
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until clickhouse-client --host clickhouse --user report_user --password report_password --query "SELECT 1" >/dev/null 2>&1; do
          sleep 3
        done
        clickhouse-client --host clickhouse --user report_user --password report_password --multiquery < /clickhouse-init/01_reporting_cdc.sql
    volumes:
      - ./clickhouse/init:/clickhouse-init:ro
    depends_on:
      - clickhouse
      - kafka
  kafka:
    image: apache/kafka:3.7.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkE3QkM5NTREQzM2NDU2Rg
    ports:
      - "9094:9092"
  kafka-connect:
    image: quay.io/debezium/connect:3.4
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "false"
      PLUGIN_PATH: /kafka/connect,/debezium-plugins
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - crm-db
  debezium-register:
    image: curlimages/curl:8.12.1
    entrypoint:
      - /bin/sh
      - /debezium/register-connector.sh
    volumes:
      - ./debezium:/debezium:ro
    depends_on:
      - kafka-connect
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9000"
      - "9002:9001"
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      TELEMETRY_DB_DSN: postgresql://telemetry_user:telemetry_password@telemetry-db:5432/telemetry_db
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: reporting
      CLICKHOUSE_USERNAME: report_user
      CLICKHOUSE_PASSWORD: report_password
      REPORT_DATASET_NAME: user_daily_reports_cdc
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    depends_on:
      clickhouse-apply-schema:
        condition: service_completed_successfully
      debezium-register:
        condition: service_completed_successfully
      telemetry-db:
        condition: service_started
  ldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: BionicPRO International
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
    ports:
      - "389:389"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://localhost:3000}
      AUTH_EXTERNAL_BASE_URL: ${AUTH_EXTERNAL_BASE_URL:-https://localhost:3000/api}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_DEFAULT_SCOPE: ${YANDEX_DEFAULT_SCOPE:-login:email login:info}
    entrypoint:
      - /bin/sh
      - /opt/keycloak/data/import-src/import-realm.sh
    volumes:
      - ./keycloak:/opt/keycloak/data/import-src:ro
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - ldap
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:8080}
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: ""
      AUTH_EXTERNAL_BASE_URL: ${AUTH_EXTERNAL_BASE_URL:-https://localhost:3000/api}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://localhost:3000}
      AUTH_SESSION_COOKIE_NAME: bionicpro_session
      AUTH_FLOW_COOKIE_NAME: bionicpro_auth_flow
      AUTH_SESSION_TTL_SECONDS: 28800
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: lax
      TOKEN_ENCRYPTION_KEY: 9lW7jQ5G6x3CJ7t4nM8h0nY5xCk3n5hY4E6QFvQ8bMs=
      PROFILE_DB_PATH: /app/data/profiles.db
    volumes:
      - ./bionicpro-auth/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_BASE_URL: http://bionicpro-auth:8000
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://localhost:3000}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: reporting
      CLICKHOUSE_USERNAME: report_user
      CLICKHOUSE_PASSWORD: report_password
      REPORT_DATASET_NAME: user_daily_reports_cdc
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-bionicpro-reports}
      S3_SECURE: "false"
      CDN_BASE_URL: ${CDN_BASE_URL:-https://localhost:3000/cdn}
      REPORT_OBJECT_PREFIX: ${REPORT_OBJECT_PREFIX:-reports}
      REPORT_OBJECT_KEY_SECRET: ${REPORT_OBJECT_KEY_SECRET:-local-report-key-secret}
    ports:
      - "8001:8001"
    depends_on:
      bionicpro-auth:
        condition: service_started
      minio:
        condition: service_started
      clickhouse-apply-schema:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: /api
    depends_on:
      - bionicpro-auth
      - reports-api
      - minio

volumes:
  crm-db-data:
  telemetry-db-data:
  clickhouse-data:
  minio-data:
  airflow-logs:
