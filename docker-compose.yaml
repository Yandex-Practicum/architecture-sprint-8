version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8081/api
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    container_name: bionicpro-auth
    ports:
      - "8081:8081"
    environment:
      - KEYCLOAK_BACKEND_URL=http://keycloak:8080/realms/reports-realm
      - KEYCLOAK_FRONTEND_URL=http://localhost:8080/realms/reports-realm
      - CLIENT_ID=reports-frontend
      - REDIRECT_URI=http://localhost:8081/callback
      - FRONTEND_URL=http://localhost:3000
      - API_URL=http://bionicpro-api:8000
    depends_on:
      - keycloak
    restart: unless-stopped
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    ports:
      - "389:389"
    environment:
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_DOMAIN: "example.com"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
  bionicpro-api:
    build:
      context: ./bionicpro-api
      dockerfile: Dockerfile
    container_name: bionicpro-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080/realms/reports-realm
    depends_on:
      - keycloak
  crm_db:
    image: postgres:14
    container_name: crm_db
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres-crm-data:/var/lib/postgresql/data
      - ./init_crm.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
  api_db:
    image: postgres:14
    container_name: api_db
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres-api-data:/var/lib/postgresql/data
      - ./init_telemetry.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"

  # --- APACHE AIRFLOW ---

  airflow-db:
    image: postgres:13
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
  airflow-init:
    build:
      context: ./airflow
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_secret_key'
    entrypoint: /bin/bash -c "airflow db upgrade && airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com"
  airflow-webserver:
    build:
      context: ./airflow
    container_name: airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_secret_key'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8085:8080"
    command: webserver
  airflow-scheduler:
    build:
      context: ./airflow
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_secret_key'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler

  # --- CDN\S3 ---
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9002:9000"       # API
      - "9001:9001"       # Веб-консоль управления
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/bionicpro-reports || true;
      /usr/bin/mc policy set download myminio/bionicpro-reports;
      exit 0;
      "

  cdn:
    image: nginx:latest
    container_name: cdn
    ports:
      - "8086:8086"
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cdn/cache:/var/cache/nginx
    depends_on:
      - minio