services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Example Inc"
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionic.ldif
    ports:
      - "389:389"

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap

  keycloak-config:
    image: quay.io/adorsys/keycloak-config-cli:5.8.0-21.1.1
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
    volumes:
      - ./keycloak/bionicpro-config.json:/config/bionicpro-config.json
    depends_on:
      - keycloak
      - openldap

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8000"
      REDIS_ADDR: redis:6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret-change-me
      OAUTH2_REDIRECT_URI: http://localhost:8000/auth/callback
      FRONTEND_URL: http://localhost:3000/
      CORS_ORIGIN: http://localhost:3000
      # Для HTTPS в production установите "true" (задача 3: флаг Secure у cookie).
      SESSION_SECURE_COOKIES: "false"
      PROFILE_DB_PATH: /data/profiles.db
    ports:
      - "8000:8000"
    volumes:
      - bionicpro-auth-data:/data
    depends_on:
      - redis
      - keycloak
      - keycloak-config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
        REACT_APP_AUTH_PREFIX: ""
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

volumes:
  bionicpro-auth-data: {}
