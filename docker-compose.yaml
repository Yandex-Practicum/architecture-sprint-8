version: '3.8'

services:

  # ── Keycloak DB ──────────────────────────────────────────────────────────────
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB:       keycloak_db
      POSTGRES_USER:     keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME:          keycloak_user
      KC_DB_PASSWORD:          keycloak_password
      YANDEX_CLIENT_ID:        YOUR_YANDEX_CLIENT_ID
      YANDEX_CLIENT_SECRET:    YOUR_YANDEX_CLIENT_SECRET
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db

  # ── OpenLDAP (foreign-office user directory) ─────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION:   "BionicPRO"
      LDAP_DOMAIN:         "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
      - ./ldap-data:/var/lib/ldap
      - ./ldap-config:/etc/ldap/slapd.d
    ports:
      - "389:389"
      - "636:636"
    command: --copy-service

  # ── BionicPRO Auth (BFF) ──────────────────────────────────────────────────────
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      KEYCLOAK_URL:           http://keycloak:8080
      KEYCLOAK_REALM:         reports-realm
      KEYCLOAK_CLIENT_ID:     bionicpro-auth-client
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret
      KEYCLOAK_CALLBACK_URL:  http://localhost:8000/auth/callback
      FRONTEND_URL:           http://localhost:3000
      SESSION_MAX_AGE:        3600
      REPORTS_API_URL:        http://reports-api:8001
    depends_on:
      - keycloak
      - reports-api

  # ── React Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000
    depends_on:
      - bionicpro-auth

  # ══ DATA LAYER ════════════════════════════════════════════════════════════════

  # ── CRM Database (OLTP source) ────────────────────────────────────────────────
  # wal_level=logical is required by Debezium for Change Data Capture.
  crm-db:
    image: postgres:14
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=5
        -c max_wal_senders=5
    environment:
      POSTGRES_DB:       crm_db
      POSTGRES_USER:     crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./crm-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - crm-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OLAP Database (legacy, used by Airflow DAG) ────────────────────────────────
  # Kept for reference; reports-api now queries ClickHouse.
  olap-db:
    image: postgres:14
    environment:
      POSTGRES_DB:       olap_db
      POSTGRES_USER:     olap_user
      POSTGRES_PASSWORD: olap_password
    volumes:
      - ./olap-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - olap-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  # ── Apache Airflow (legacy ETL; now supplementary to CDC) ─────────────────────
  airflow:
    image: apache/airflow:2.9.1-python3.11
    environment:
      AIRFLOW__CORE__EXECUTOR:                    LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES:               "false"
      AIRFLOW__WEBSERVER__SECRET_KEY:             bionicpro-airflow-secret
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      CRM_DB_HOST:     crm-db
      CRM_DB_PORT:     "5432"
      CRM_DB_NAME:     crm_db
      CRM_DB_USER:     crm_user
      CRM_DB_PASSWORD: crm_password
      OLAP_DB_HOST:     olap-db
      OLAP_DB_PORT:     "5432"
      OLAP_DB_NAME:     olap_db
      OLAP_DB_USER:     olap_user
      OLAP_DB_PASSWORD: olap_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements.txt:/requirements.txt
      - airflow-data:/opt/airflow
    ports:
      - "8090:8080"
    command: >
      bash -c "
        pip install --quiet -r /requirements.txt &&
        airflow db migrate &&
        airflow users create
          --username airflow --password airflow
          --firstname Airflow --lastname Admin
          --role Admin --email airflow@bionicpro.local || true &&
        airflow scheduler &
        airflow webserver
      "
    depends_on:
      - crm-db
      - olap-db

  # ══ CDC PIPELINE (Assignment 4) ═══════════════════════════════════════════════

  # ── Apache Kafka (KRaft mode — no ZooKeeper) ──────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID:                        0
      KAFKA_CFG_PROCESS_ROLES:                  controller,broker
      KAFKA_CFG_LISTENERS:                      PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS:       0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE:      "true"
      KAFKA_CFG_LOG_RETENTION_HOURS:            "168"     # 7 days
    volumes:
      - kafka-data:/bitnami/kafka
    ports:
      - "9094:9094"   # external access (optional)
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka Connect + Debezium PostgreSQL connector ─────────────────────────────
  kafka-connect:
    image: quay.io/debezium/connect:2.6
    environment:
      BOOTSTRAP_SERVERS:        kafka:9092
      GROUP_ID:                 "1"
      CONFIG_STORAGE_TOPIC:     debezium_connect_configs
      OFFSET_STORAGE_TOPIC:     debezium_connect_offsets
      STATUS_STORAGE_TOPIC:     debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR:  "1"
      OFFSET_STORAGE_REPLICATION_FACTOR:  "1"
      STATUS_STORAGE_REPLICATION_FACTOR:  "1"
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      crm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Debezium connector registration (one-shot) ────────────────────────────────
  debezium-init:
    image: curlimages/curl:latest
    volumes:
      - ./debezium/connector-config.json:/connector-config.json
      - ./debezium/register-connector.sh:/register-connector.sh
    entrypoint: sh /register-connector.sh
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      CONFIG_FILE:       /connector-config.json
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: on-failure

  # ── ClickHouse (OLAP, CDC destination) ────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    environment:
      CLICKHOUSE_DB:       bionicpro
      CLICKHOUSE_USER:     default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9009:9000"   # native protocol (mapped to 9009 to avoid conflict with MinIO)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══ OBJECT STORAGE + CDN (Assignment 3) ═══════════════════════════════════════

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket bootstrap ────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/bionicpro-reports --ignore-existing &&
        mc anonymous set public local/bionicpro-reports &&
        mc ilm rule add --expire-days 7 local/bionicpro-reports &&
        echo 'MinIO bucket ready'
      "

  # ── Nginx CDN (reverse proxy with caching) ────────────────────────────────────
  cdn:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cache:/var/cache/nginx/reports
    ports:
      - "8100:8100"
    depends_on:
      - minio

  # ── Reports API ───────────────────────────────────────────────────────────────
  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      KEYCLOAK_URL:      http://keycloak:8080
      KEYCLOAK_REALM:    reports-realm
      # ClickHouse (primary OLAP source — Assignment 4)
      CLICKHOUSE_HOST:   clickhouse
      CLICKHOUSE_PORT:   "8123"
      CLICKHOUSE_DB:     bionicpro
      CLICKHOUSE_USER:   default
      CLICKHOUSE_PASSWORD: ""
      # S3 + CDN (Assignment 3)
      S3_ENDPOINT:       http://minio:9000
      S3_ACCESS_KEY:     minioadmin
      S3_SECRET_KEY:     minioadmin
      S3_BUCKET:         bionicpro-reports
      CDN_BASE_URL:      http://localhost:8100
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        - service_started

volumes:
  crm-db-data:
  olap-db-data:
  airflow-data:
  kafka-data:
  clickhouse-data:
  minio-data:
  nginx-cache:
