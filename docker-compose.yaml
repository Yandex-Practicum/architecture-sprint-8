version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  openldap:
    build:
      context: ./ldap
      dockerfile: Dockerfile
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: bionicpro.com
      LDAP_ADMIN_PASSWORD: ldap_admin_password
      LDAP_TLS: "false"
    ports:
      - "389:389"

  ldap-seed:
    build:
      context: ./ldap
      dockerfile: seed.Dockerfile
    environment:
      LDAP_ADMIN_PASSWORD: ldap_admin_password
    depends_on:
      - openldap
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
      - ldap-seed

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      LISTEN: ":8443"
      FRONT_URL: http://localhost:3000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      AUTH_CALLBACK_URL: http://localhost:8443/auth/callback
      SESSION_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      API_URL: http://reports-api:8000
    ports:
      - "8443:8443"
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8443

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: bionicpro_dm
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"

  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
    ports:
      - "9042:9042"

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      LISTEN: ":8000"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: bionicpro_dm
      QUERY_TIMEOUT: 10s
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_started

volumes:
  clickhouse-data:
  cassandra-data: