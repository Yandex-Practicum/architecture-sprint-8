version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  # База данных для CRM
  crm-db:
    image: postgres:14
    container_name: crm-db
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"  # CRM на порту 5433
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/crm-init.sql:/docker-entrypoint-initdb.d/01-crm-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # База данных для телеметрии
  telemetry-db:
    image: postgres:14
    container_name: telemetry-db
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"  # Телеметрия на порту 5434
    volumes:
      - telemetry_postgres_data:/var/lib/postgresql/data
      - ./init-scripts/telemetry-init.sql:/docker-entrypoint-initdb.d/01-telemetry-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse для витрины данных
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: prosthetics-clickhouse
    ports:
      - "8123:8123"  # HTTP интерфейс
      - "9000:9000"  # Native protocol
      - "9009:9009"  # Interserver HTTP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-config/config.xml:/etc/clickhouse-server/config.xml
      - ./init-scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      CLICKHOUSE_DB: prosthetics_mart
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  crm_postgres_data:
  telemetry_postgres_data:
  clickhouse_data:
  clickhouse_logs:
