version: '3.8'

services:
  postgres:
    image: postgres:16.0
    volumes:
      - ./Task2/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: sample
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: playaru/keycloak-russian #quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_FEATURES: token-exchange     
      YANDEX_CLIENT_ID: 20966e97364145979a9eecfe895403cd
      YANDEX_CLIENT_SECRET: 97b6bc1107ff4b8c85f5a618ad5c2589
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:5000
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
  auth:
    build:
      context: ./bionicpro-auth
      dockerfile: ./BionicproAuth.Api/Dockerfile
    ports:
    - "5000:8080"
    environment:
      Keycloak__Authority: http://keycloak:8080/realms/reports-realm
      Keycloak__ClientId: reports-frontend
      Keycloak__RedirectUri: http://localhost:5000/auth/callback
      Keycloak__PostLogoutRedirectUri: http://localhost:3000
      Session__CookieName: bionicpro.session
      Session__CookieDomain: localhost
      Session__SessionLifetimeMinutes: 30
      ApiProxy__ReportServiceUrl: http://report:8080

    depends_on:
      - keycloak
  report:
    build:
      context: ./bionicpro-report
      dockerfile: ./BionicproReport/Dockerfile
    ports:
    - "5103:8080"
    environment:
      Keycloak__Authority: http://keycloak:8080/realms/reports-realm
      Keycloak__ReportsApi__ClientId: reports-api
      Keycloak__RedirectUri: http://localhost:5000/auth/callback
      ConnectionStrings__ReportingDb: Host=postgres;Port=5432;Database=sample;Username=airflow;Password=airflow
      S3__Endpoint: http://minio:9000
      S3__AccessKey: minioadmin
      S3__SecretKey: minioadmin
      S3__BucketName: reports
      S3__ForcePathStyle: true       
      Cdn__BaseUrl: http://localhost:8081/reports
    depends_on:
      - auth
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/reports || true;
      mc anonymous set download myminio/reports;
      exit 0;
      "

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    ports:
      - "8081:80"
    depends_on:
      - minio
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-connect:
    image: debezium/connect:2.5
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      # Плагины для JDBC Sink (загружаются отдельно, но можно добавить volume)
    volumes:
      - ./kafka-connect-plugins:/kafka/connect/plugins  # для дополнительных коннекторов
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"

volumes:
  minio-data:
  nginx-cache:
