version: '3.8'

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"

  auth_db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro_auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  # --- Задание 4: OLTP CRM + CDC (Debezium) + Kafka + ClickHouse ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  crm_db:
    image: postgres:14
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    volumes:
      - ./crm/sql:/docker-entrypoint-initdb.d
      - ./dwh/data:/seed:ro
      - crm-oltp-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  debezium:
    image: debezium/connect:2.5
    depends_on:
      - kafka
      - crm_db
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"

  debezium-register:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_started
      crm_db:
        condition: service_healthy
    volumes:
      - ./debezium/connector-crm.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 40
        if curl -sfS http://debezium:8083/connectors/crm-connector >/dev/null 2>&1; then
          echo "Debezium connector crm-connector already registered"
        else
          curl -sfS -X POST -H "Content-Type: application/json" -d @/connector.json http://debezium:8083/connectors
        fi
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9123:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/users.d/allow-default-network.xml:/etc/clickhouse-server/users.d/allow-default-network.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      kafka:
        condition: service_started

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/docker-entrypoint-initdb.d:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        sleep 2
        clickhouse-client --host clickhouse --port 9000 --user default --password '' --multiquery < /init/01_reporting.sql
    restart: "no"

  # OLAP-витрина для сервиса отчётов (задание 2)
  # S3 API (задание 3): хранение JSON отчётов; CDN — отдельный Nginx ниже.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret_change
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        i=0
        while [ $$i -lt 60 ]; do
          mc alias set local http://minio:9000 minio minio_secret_change && break
          i=$$((i+1))
          sleep 1
        done
        mc mb local/reports --ignore-existing
        mc anonymous set download local/reports
    restart: "no"

  # Эмуляция CDN: reverse proxy к MinIO + proxy_cache по URL (новый отчёт = новый путь в S3).
  # Прокси BFF не использует этот сервис — см. APP_CDN_PROXY_TARGET → minio:9000/reports (стабильный DNS).
  minio-cdn:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./infra/cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cdn-cache:/var/cache/nginx
    depends_on:
      - minio

  olap_db:
    image: postgres:14
    environment:
      POSTGRES_DB: olap
      POSTGRES_USER: olap
      POSTGRES_PASSWORD: olap
    volumes:
      - ./dwh/sql/init-olap.sql:/docker-entrypoint-initdb.d/01-init.sql
      - olap-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olap -d olap"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    environment:
      # Единый issuer в JWT (http://localhost:8080/realms/...), иначе токен с localhost iss + UserInfo на http://keycloak:8080 даёт invalid_token (issuer mismatch).
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    healthcheck:
      # Keycloak container images do not include `curl`. Use /dev/tcp or a simple script.
      # This example uses a shell command to check the TCP port and HTTP status.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi;"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s # Gives Keycloak time to start up before the first check
    depends_on:
      keycloak_db:
        condition: service_started
      openldap:
        condition: service_started

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8181:8181"
    # С хоста в контейнер Keycloak: тот же issuer, что в JWT (localhost), не http://keycloak:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth_db:5432/bionicpro_auth
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      # Браузер: localhost. Сервер (token / userinfo / jwks): host.docker.internal → порт хоста 8080, совпадает с KC_HOSTNAME=localhost и iss в токенах.
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: "http://localhost:8080/realms/reports-realm/protocol/openid-connect/auth"
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: "http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/token"
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: "http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/userinfo"
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: "http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/certs"
      KEYCLOAK_PROVIDER_AUTHORIZATION_URI: "http://localhost:8080/realms/reports-realm/protocol/openid-connect/auth"
      KEYCLOAK_PROVIDER_TOKEN_URI: "http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/token"
      KEYCLOAK_PROVIDER_USER_INFO_URI: "http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/userinfo"
      KEYCLOAK_PROVIDER_JWK_SET_URI: "http://host.docker.internal:8080/realms/reports-realm/protocol/openid-connect/certs"
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret-change-in-prod
      APP_FRONTEND_URL: http://localhost:3000
      APP_COOKIE_SECURE: "false"
      REPORTS_SERVICE_BASE_URL: http://bionicpro-reports:8082
      APP_CDN_PROXY_TARGET: http://minio:9000/reports
    depends_on:
      auth_db:
        condition: service_started
      keycloak:
        condition: service_healthy
      bionicpro-reports:
        condition: service_started
      minio:
        condition: service_started

  bionicpro-reports:
    build:
      context: ./bionicpro-reports
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      # Задание 4: витрина в ClickHouse (KafkaEngine + MV); PostgreSQL OLAP только для legacy Airflow.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: reporting
      KEYCLOAK_ISSUER: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      S3_ENABLED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_secret_change
      S3_BUCKET: reports
      S3_REGION: us-east-1
      CDN_PUBLIC_BASE: http://localhost:8181/reports-cdn
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:8181,http://localhost:8090
    depends_on:
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      minio-cdn:
        condition: service_started
      clickhouse-init:
        condition: service_completed_successfully
      debezium-register:
        condition: service_completed_successfully

  # standalone даёт случайный пароль админа — не подходит для airflow/airflow.
  # webserver: миграция БД + создание пользователя через переменные _AIRFLOW_WWW_USER_* (см. docker-stack entrypoint).
  airflow-webserver:
    build:
      context: ./dwh/airflow
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      _AIRFLOW_WWW_USER_EMAIL: airflow@example.com
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      REPORTING_OLAP_DSN: postgresql://olap:olap@olap_db:5432/olap
      REPORTING_CRM_DSN: postgresql://postgres:postgres@crm_db:5432/crm
      AIRFLOW_DATA_DIR: /opt/airflow/data
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./dwh/dags:/opt/airflow/dags
      - ./dwh/data:/opt/airflow/data
      - airflow-home:/opt/airflow
    depends_on:
      olap_db:
        condition: service_healthy
      crm_db:
        condition: service_healthy
    command: webserver

  airflow-scheduler:
    build:
      context: ./dwh/airflow
      dockerfile: Dockerfile
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      REPORTING_OLAP_DSN: postgresql://olap:olap@olap_db:5432/olap
      REPORTING_CRM_DSN: postgresql://postgres:postgres@crm_db:5432/crm
      AIRFLOW_DATA_DIR: /opt/airflow/data
    volumes:
      - ./dwh/dags:/opt/airflow/dags
      - ./dwh/data:/opt/airflow/data
      - airflow-home:/opt/airflow
    depends_on:
      olap_db:
        condition: service_healthy
      crm_db:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    command: scheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH_URL: http://localhost:8181
        REACT_APP_API_URL: http://localhost:8181
    ports:
      - "3000:3000"

volumes:
  postgres-auth-data:
  postgres-keycloak-data:
  olap-data:
  airflow-home:
  minio-data:
  nginx-cdn-cache:
  zookeeper-data:
  kafka-data:
  crm-oltp-data:
  clickhouse-data:
