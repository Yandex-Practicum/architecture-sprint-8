version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    container_name: bionicpro-keycloak-db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bionicpro-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    container_name: bionicpro-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: "127.0.0.1"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
    networks:
      - bionicpro-network

  openldap:
    image: osixia/openldap:1.5.0
    container_name: bionicpro-openldap
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: "bionicpro.com"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_TLS_VERIFY_CLIENT: "never"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif
    ports:
      - "389:389"
      - "636:636"
    networks:
      - bionicpro-network

  redis:
    image: redis:7-alpine
    container_name: bionicpro-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - bionicpro-network

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    container_name: bionicpro-auth-service
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://127.0.0.1:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret-key-2024
      FRONTEND_URL: http://127.0.0.1:3000
      AUTH_SERVICE_BASE_URL: http://127.0.0.1:5000
      SESSION_SECRET_KEY: super-secret-session-key-change-in-production
      REDIS_URL: redis://redis:6379/0
      ACCESS_TOKEN_MAX_AGE: 120
      SESSION_MAX_AGE: 1800
    ports:
      - "5000:5000"
    depends_on:
      - keycloak
      - redis
    networks:
      - bionicpro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://127.0.0.1:8000
        REACT_APP_AUTH_SERVICE_URL: http://127.0.0.1:5000
        REACT_APP_KEYCLOAK_URL: http://127.0.0.1:8080
        REACT_APP_KEYCLOAK_REALM: reports-realm
        REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    container_name: bionicpro-frontend
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
    networks:
      - bionicpro-network

  # CRM Database (PostgreSQL) - имитация CRM-системы
  crm_db:
    image: postgres:14
    container_name: bionicpro-crm-db
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
      - ./airflow/init-crm.sql:/docker-entrypoint-initdb.d/init-crm.sql
    ports:
      - "5434:5432"
    networks:
      - bionicpro-network

  # ClickHouse - OLAP хранилище для аналитики
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: bionicpro-clickhouse
    environment:
      CLICKHOUSE_DB: analytics_db
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - bionicpro-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Airflow PostgreSQL - метадата Airflow
  airflow_db:
    image: postgres:14
    container_name: bionicpro-airflow-db
    environment:
      POSTGRES_DB: airflow_db
      POSTGRES_USER: airflow_user
      POSTGRES_PASSWORD: airflow_password
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - bionicpro-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow_user"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: bionicpro-airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'bionicpro_airflow_secret_key_2024'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      CRM_DB_HOST: crm_db
      CRM_DB_PORT: 5432
      CRM_DB_NAME: crm_db
      CRM_DB_USER: crm_user
      CRM_DB_PASSWORD: crm_password
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DB: analytics_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      crm_db:
        condition: service_started
      clickhouse:
        condition: service_started
    networks:
      - bionicpro-network
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: bionicpro-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      CRM_DB_HOST: crm_db
      CRM_DB_PORT: 5432
      CRM_DB_NAME: crm_db
      CRM_DB_USER: crm_user
      CRM_DB_PASSWORD: crm_password
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DB: analytics_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      crm_db:
        condition: service_started
      clickhouse:
        condition: service_started
    networks:
      - bionicpro-network
    command: scheduler

  # Airflow Init - инициализация БД и создание админа
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: bionicpro-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
    depends_on:
      airflow_db:
        condition: service_healthy
    networks:
      - bionicpro-network
    command:
      - bash
      - -c
      - |
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@bionicpro.com

  # Reports API Service - сервис для получения отчетов
  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    container_name: bionicpro-reports-api
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DB: analytics_db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_PUBLIC_KEY_URL: http://keycloak:8080/realms/reports-realm
    ports:
      - "8000:8000"
    depends_on:
      - clickhouse
      - keycloak
    networks:
      - bionicpro-network

volumes:
  keycloak-postgres-data:
  ldap-data:
  ldap-config:
  redis-data:
  crm-postgres-data:
  clickhouse-data:
  airflow-postgres-data:
  airflow-logs:

networks:
  bionicpro-network:
    driver: bridge
