services:

  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      - LDAP_ORGANISATION=Example
      - LDAP_BASE_DN=example.com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin123
      - LDAP_CONFIG_PASSWORD=admin123
      - LDAP_TLS=false
      - LDAP_REMOVE_CONFIG_AFTER_SETUP=false
      - LDAP_READONLY_USER=false
      - LDAP_BACKEND=mdb
      - DAP_REPLICATION=false
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    ports:
      - "389:389"
      - "636:636"
    command: [
      "--copy-service",
      "--loglevel", "debug"
    ]
    networks:
      - bionicpro-net
    restart: unless-stopped

  ldap-init:
    image: osixia/openldap:1.5.0
    container_name: ldap-init
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    entrypoint: |
      sh -c '
        echo "Waiting for OpenLDAP to be ready..."
        sleep 3
        
        echo "Adding LDAP entries..."
        ldapadd -x -H ldap://openldap:389 -D "cn=admin,dc=example,dc=com" -w admin123 -f /container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
                
        echo "Initialization completed!"
      '
    networks:
      - bionicpro-net
    depends_on:
      - openldap
    restart: "no"

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "8090:80"
    depends_on:
      - ldap-init
      - openldap
    networks:
      - bionicpro-net

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5433:5432"
    networks:
      - bionicpro-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_FEATURES: scripts
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/keycloak-export-ldap/:/opt/keycloak/data/import/
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - ldap-init
    networks:
      - bionicpro-net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_VITE_API_URL: https://api.bio-pro.local:444
      REACT_APP_VITE_API_TIMEOUT: 30000
    networks:
      - bionicpro-net

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    environment:
      Keycloak__realm: reports-realm
      Keycloak__auth-server-url: http://keycloak:8080
      Keycloac__credentionals__client-id: reports-frontend
      Keycloac__credentionals__secret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
    networks:
      - bionicpro-net


  nginx:
    image: nginx:latest
    container_name: web_nginx
    depends_on:
      - frontend
      - bionicpro-auth
    volumes:
      - ./nginx/Docker.nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/certs:ro
    ports:
      - 444:444
    restart: always
    networks:
      - bionicpro-net



networks:
  bionicpro-net:
    driver: bridge