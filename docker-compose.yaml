services:

  nginx:
    image: nginx:latest
    container_name: web_nginx
    depends_on:
      - frontend
      # - bionicpro-auth
      - keycloak
    volumes:
      - ./nginx/Docker.nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/certs:ro
    ports:
      - 444:444
      - 443:443
      - 8050:8050
    restart: always
    networks:
      - bionicpro-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTPS_ENABLED: false
      KC_HOSTNAME: key.bio-pro.local
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/keycloak-export-ldap/reports-realm-realm-yandex.json:/opt/keycloak/data/import/reports-realm-realm.json
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      - keycloak_db
      - ldap-init
    networks:
      - bionicpro-net

  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    environment:
      - LDAP_ORGANISATION=Example
      - LDAP_BASE_DN=example.com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin123
      - LDAP_CONFIG_PASSWORD=admin123
      - LDAP_TLS=false
      - LDAP_REMOVE_CONFIG_AFTER_SETUP=false
      - LDAP_READONLY_USER=false
      - LDAP_BACKEND=mdb
      - DAP_REPLICATION=false
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    ports:
      - "389:389"
      - "636:636"
    command: [
      "--copy-service",
      "--loglevel", "debug"
    ]
    networks:
      - bionicpro-net
    restart: unless-stopped

  ldap-init:
    image: osixia/openldap:1.5.0
    container_name: ldap-init
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    entrypoint: |
      sh -c '
        echo "Waiting for OpenLDAP to be ready..."
        sleep 3
        
        echo "Adding LDAP entries..."
        ldapadd -x -H ldap://openldap:389 -D "cn=admin,dc=example,dc=com" -w admin123 -f /container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
                
        echo "Initialization completed!"
      '
    networks:
      - bionicpro-net
    depends_on:
      - openldap
    restart: "no"

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "8090:80"
    depends_on:
      - ldap-init
      - openldap
    networks:
      - bionicpro-net

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5431:5432"
    networks:
      - bionicpro-net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: https://api.bio-pro.local:444/api
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
      REACT_APP_VITE_API_TIMEOUT: 30000
    networks:
      - bionicpro-net

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    environment:
      Keycloak__realm: reports-realm
      Keycloak__auth-server-url: http://keycloak:8080
      Keycloac__credentionals__client-id: reports-frontend
      Keycloac__credentionals__secret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
    networks:
      - bionicpro-net


## TASK 3

  postgres_airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - bionicpro-net
  postgres_crm:
    image: postgres:13
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    volumes:
      - ./Task2/scripts/init_crm_db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_crm_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crm_user", "-d", "crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bionicpro-net

  postgres_telemetry:
    image: postgres:13
    environment:
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
      POSTGRES_DB: telemetry_db
    volumes:
      - ./Task2/scripts/init_telemetry_db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_telemetry_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "telemetry_user", "-d", "telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bionicpro-net


  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: bionicpro 
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./Task2/scripts/init_clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    restart: always
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bionicpro-net


  airflow-webserver:
    build: ./Task2/.
    depends_on:
      - postgres_airflow
      - postgres_crm
      - postgres_telemetry
      - clickhouse
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW_CONN_CRM: postgresql://crm_user:crm_password@postgres_crm:5432/crm_db
      AIRFLOW_CONN_TELEMETRY: postgresql://telemetry_user:telemetry_password@postgres_telemetry:5432/telemetry_db
      AIRFLOW_CONN_CLICKHOUSE: clickhouse://default:@clickhouse:8123/default
    volumes:
      - ./Task2/dags:/opt/airflow/dags
      - ./Task2/logs:/opt/airflow/logs
    ports:
      - "8000:8080"
    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
      airflow webserver
      "
    restart: always
    networks:
      - bionicpro-net

  bionicpro-report:
    build:
      context: ./bionicpro-report
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__ClickHouse: Host=clickhouse;Port=8123;Database=bionicpro;Username=default;Password=
      Keycloak__auth-server-url: http://keycloak:8080
      Keycloac__credentionals__client-id: reports-frontend
      Keycloac__credentionals__secret: oNwoLQdvJAvRcL89SydqCWCe5ry1jMgq
    networks:
      - bionicpro-net


  airflow-scheduler:
    build: ./Task2/.
    depends_on:
      - postgres_airflow
      - postgres_crm
      - postgres_telemetry
      - clickhouse
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW_CONN_CRM: postgresql://crm_user:crm_password@postgres_crm:5432/crm_db
      AIRFLOW_CONN_TELEMETRY: postgresql://telemetry_user:telemetry_password@postgres_telemetry:5432/telemetry_db
      AIRFLOW_CONN_CLICKHOUSE: clickhouse://default:@clickhouse:8123/default
    volumes:
      - ./Task2/dags:/opt/airflow/dags
      - ./Task2/logs:/opt/airflow/logs
    command: ["airflow", "scheduler"]
    restart: always
    networks:
      - bionicpro-net


## TASK 3


  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DEFAULT_BUCKETS: my-first-bucket:policy,my-second-bucket
      MINIO_API_CORS_ALLOW_ORIGIN: front.bio-pro.local
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - bionicpro-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
        /bin/sh -c "
        sleep 5;
        /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
        /usr/bin/mc mb myminio/bionicpro-reports --ignore-existing;
        /usr/bin/mc policy set download myminio/bionicpro-reports;
        /usr/bin/mc anonymous set download myminio/bionicpro-reports;
        echo 'Bucket policy configured';
        exit 0;
        "
    networks:
      - bionicpro-net


networks:
  bionicpro-net:
    driver: bridge


volumes:
  postgres_airflow_data:
  postgres_crm_data:
  postgres_telemetry_data:
  clickhouse_data:
  minio_data: