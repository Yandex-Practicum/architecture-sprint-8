version: '3.8'
name: bionicpro-platform

include:
  - ./pipeline/docker-compose.yml

services:
  openldap:
    image: osixia/openldap:1.5.0  # Явно фиксируем стабильную версию
    container_name: openldap
    command: --copy-service
    #volumes:
      #- ./ldap/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    environment:
      - LDAP_ORGANISATION=bionicpro
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
    networks:
      - bionicpro-network

  keycloak_db:
    image: postgres:14
    container_name: keycloak_db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bionicpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: http://localhost:8080
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    networks:
      - bionicpro-network
    depends_on:
      keycloak_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  bionicpro-auth:
    image: ${DOCKER_REGISTRY-}bionicproauth
    container_name: bionicpro-auth
    user: "0:0" # ДОБАВЬТЕ ЭТУ СТРОКУ (Чтобы сервис отчетов мог читать эти ключи)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_SERVER__KESTREL__LIMITS__MAXREQUESTHEADERSIZE: 32768
      Keycloak__Authority: "http://localhost:8080/realms/reports-realm"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/reports-realm/.well-known/openid-configuration"
    volumes:
      - shared-auth-keys:/app/shared-auth-keys
    ports:
      - "7000:8080"
    build:
      context: .
      dockerfile: bionicpro-auth/bionicpro-auth/Dockerfile
    depends_on:
      - keycloak
    networks:
      - bionicpro-network

  bionicpro-reports:
    image: ${DOCKER_REGISTRY-}bionicproreports
    container_name: bionicpro-reports
    user: "0:0" # ДОБАВЬТЕ ЭТУ СТРОКУ (Чтобы сервис отчетов мог читать эти ключи)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_SERVER__KESTREL__LIMITS__MAXREQUESTHEADERSIZE: 32768
      ConnectionStrings__PGReports: "Host=postgres;Database=airflow;Username=airflow;Password=airflow"
      ConnectionStrings__Reports: "URL=http://clickhouse:8123/default" 
    ports:
      - "7001:8080" # Порт для сервиса отчетов    
    build:
      context: .
      dockerfile: bionicpro-reports/bionicpro-reports/Dockerfile
    volumes:
      - shared-auth-keys:/app/shared-auth-keys # Монтируем ТУ ЖЕ самую папку ключей
    depends_on:
      - postgres 
    networks:
      - bionicpro-network

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"       # S3 API Эндпоинт
      - "9001:9001"       # Консоль управления (логин: minio_admin / пароль: minio_password)
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    networks:
      - bionicpro-network
    volumes:
      - minio-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bionicpro-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - bionicpro-network

  debezium:
    image: debezium/connect:2.4
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: bionicpro_connect_configs
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_statuses
      # Настройки конвертации сообщений в чистый JSON без тяжелых мета-схем внутри топиков
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      - kafka
      - postgres
    networks:
      - bionicpro-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP интерфейс для получения запросов от .NET API
      - "9000:9000" # Native протокол
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - bionicpro-network


networks:
  bionicpro-network:
    name: bionicpro-network
    driver: bridge

volumes:
  shared-auth-keys:
  minio-data:
  clickhouse-data:
