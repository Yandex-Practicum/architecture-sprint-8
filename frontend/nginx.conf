server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API-запросов к BFF (bionicpro-auth)
    # Фронтенд делает fetch('/auth/...') и fetch('/api/...') — 
    # nginx перенаправляет на BFF, избегая CORS-проблем.
    location /auth/ {
        proxy_pass http://bionicpro-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://bionicpro-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # CDN-запросы проксируем к Nginx CDN (порт 8088 → но внутри сети → nginx:80)
    location /cdn/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
