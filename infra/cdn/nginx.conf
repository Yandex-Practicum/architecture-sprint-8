daemon off;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Эмуляция CDN: кэш ответов MinIO (S3 GET) по URL — новая версия отчёта = новый путь в S3 = новый ключ кэша.
    proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=report_cache:20m max_size=500m inactive=7d use_temp_path=off;

    server {
        listen 80;
        server_name _;

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://minio:9000/reports$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache report_cache;
            proxy_cache_valid 200 1d;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status always;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        }
    }
}
