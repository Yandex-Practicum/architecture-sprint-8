proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:50m max_size=2g inactive=24h use_temp_path=off;

server {
  listen 80;

  # CDN URL будет: http://localhost:8089/reports/<object_key>
  location /reports/ {
    # Внутри тянем из MinIO (bucket reports), path-style:
    # /reports/<key> -> http://minio:9000/reports/<key>
    proxy_pass http://minio:9000/reports/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Cache settings
    proxy_cache reports_cache;
    proxy_cache_key $scheme$proxy_host$request_uri;
    proxy_cache_valid 200 302 24h;
    proxy_cache_valid 404 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Покажем статус кеша для проверки
    add_header X-Cache-Status $upstream_cache_status always;

    # Нормальные заголовки для статики
    add_header Cache-Control "public, max-age=3600" always;
  }

  location /health {
    return 200 "ok\n";
  }
}
