proxy_cache_path /var/cache/nginx/s3_cache
    levels=1:2
    keys_zone=s3_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Caching static report files from Minio (S3)
    location / {
        proxy_pass http://minio:9000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable caching
        proxy_cache s3_cache;

        # Cache 200 responses for 30 minutes
        # After ETL update new reports will have different URL (version hash),
        # so old cache doesn't interfere, and new requests get fresh data
        proxy_cache_valid 200 30m;

        # Cache 404 for short time (report may appear later)
        proxy_cache_valid 404 1m;

        # Add debug header (HIT/MISS/BYPASS)
        add_header X-Cache-Status $upstream_cache_status;

        # Allow serving stale cache on upstream errors
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # Prevent simultaneous generation of the same cache
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # CORS headers for frontend access
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Handle preflight OPTIONS requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # CDN health check endpoint
    location /cdn-health {
        access_log off;
        return 200 '{"status": "healthy", "service": "cdn-nginx"}';
        add_header Content-Type application/json;
    }
}
