worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --------------- Кеш-зона для ответов reports-api ---------------
    # levels=1:2  — двухуровневая структура каталогов кеша
    # keys_zone   — 10 МБ под метаданные ключей (≈80 000 записей)
    # max_size    — до 1 ГБ кешированных файлов на диске
    # inactive    — записи без обращений за 24 ч удаляются автоматически
    proxy_cache_path /var/cache/nginx/reports
                     levels=1:2
                     keys_zone=reports_cache:10m
                     max_size=1g
                     inactive=24h
                     use_temp_path=off;

    # --------------- Кеш-зона для S3-объектов (JSON-отчёты) ---------------
    proxy_cache_path /var/cache/nginx/s3
                     levels=1:2
                     keys_zone=s3_cache:10m
                     max_size=2g
                     inactive=24h
                     use_temp_path=off;

    upstream reports_backend {
        server reports-api:8001;
    }

    upstream minio_backend {
        server minio:9000;
    }

    server {
        listen 80;
        server_name localhost;

        # --------------- API отчётов (проксирование к reports-api) ---------------
        location /reports {
            proxy_pass http://reports_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;

            # Кеширование GET-ответов API
            proxy_cache reports_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Заголовок для диагностики: HIT / MISS / STALE / EXPIRED
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # --------------- S3: статические JSON-отчёты из MinIO ---------------
        # Структура URL: /s3/reports/{user_id}/{report_date}.json
        # Пример: /s3/reports/42/2025-03-30.json
        location /s3/ {
            proxy_pass http://minio_backend/reports/;
            proxy_set_header Host minio:9000;

            # Агрессивное кеширование — данные меняются только после ETL
            proxy_cache s3_cache;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Content-Type "application/json" always;
        }

        # --------------- Инвалидация кеша (вызывается из ETL) ---------------
        # POST /cache/purge — очищает файловый кеш Nginx
        # Доступ ограничен Docker-сетями (внутренние вызовы)
        location = /cache/purge {
            proxy_pass http://reports_backend/cache/purge;
            proxy_set_header Host $host;
        }

        # --------------- Health check ---------------
        location /health {
            proxy_pass http://reports_backend/health;
            proxy_set_header Host $host;
        }
    }
}
