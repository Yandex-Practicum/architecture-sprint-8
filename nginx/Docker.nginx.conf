worker_processes 1;

events { worker_connections 1024; }
http
{
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;


    server {
        listen 80;
        listen 444 ssl;
        server_name front.bio-pro.local;
        ssl_certificate /etc/certs/front.bio-pro.local.crt;
        ssl_certificate_key /etc/certs/front.bio-pro.local.key;
        location / {
            proxy_pass http://frontend:3000;
        }
    }

    server {
        listen 80;
        listen 444 ssl;
        server_name api.bio-pro.local;
        ssl_certificate /etc/certs/api.bio-pro.local.crt;
        ssl_certificate_key /etc/certs/api.bio-pro.local.key;
              
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / {
            proxy_pass http://bionicpro-auth:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Ssl on;
            proxy_set_header X-Url-Scheme https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }


    server {
        # 1. Слушаем HTTPS-порт на хосте
        listen 443 ssl;
        server_name key.bio-pro.local;

        # 2. Пути к SSL-сертификатам (лежат в папке ./certs на хосте)
        ssl_certificate /etc/certs/key.bio-pro.local.crt;
        ssl_certificate_key /etc/certs/key.bio-pro.local.key;

        # Базовые SSL-настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 3. Корневой location: проксируем все запросы на Keycloak
        location / {
            # ВАЖНО: используем ИМЯ СЕРВИСА из docker-compose.yml и ВНУТРЕННИЙ ПОРТ 8080
            proxy_pass http://keycloak:8080;

            # --- НАБОР КРИТИЧЕСКИ ВАЖНЫХ ЗАГОЛОВКОВ ---
            # Передаем оригинальный hostname
            proxy_set_header Host $host;
            # Сообщаем Keycloak реальный IP клиента
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Сообщаем, что оригинальный протокол был HTTPS [citation:1][citation:2]
            proxy_set_header X-Forwarded-Proto $scheme;
            # Явно указываем порт 443 для корректной генерации ссылок [citation:1]
            proxy_set_header X-Forwarded-Port 443;

            # Необходимо для работы WebSocket (если используется)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }



}