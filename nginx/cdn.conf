proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m
                 max_size=512m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;

        proxy_cache cdn_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;

        # Minio отдаёт свой набор CORS-заголовков; прячем их, чтобы не было
        # двойного Access-Control-Allow-Origin (браузер отвергает такой ответ).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
