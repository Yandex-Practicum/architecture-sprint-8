# =============================================================================
# BionicPRO · Nginx · Reverse Proxy + Cache (CDN эмуляция)
# =============================================================================
# Nginx проксирует запросы к MinIO (S3) и кэширует ответы.
# Это снижает нагрузку на MinIO и эмулирует CDN-поведение.
#
# Фронтенд обращается:  GET /cdn/reports/{userId}/report.json
# Nginx проксирует в:   GET http://minio:9000/reports/{userId}/report.json
# Кэш живёт 24 часа (совпадает с периодом ETL).
# =============================================================================

proxy_cache_path /var/cache/nginx/s3
    levels=1:2
    keys_zone=s3_cache:10m
    max_size=1g
    inactive=24h
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    # ── CDN: проксирование к MinIO с кэшированием ─────────────────────
    location /cdn/reports/ {
        # Убираем /cdn из пути при проксировании
        rewrite ^/cdn/(.*)$ /$1 break;

        proxy_pass http://minio:9000;

        # Кэширование
        proxy_cache s3_cache;
        proxy_cache_valid 200 24h;       # Успешные ответы — 24 часа
        proxy_cache_valid 404 1m;        # Not Found — 1 минута (отчёт может появиться)
        proxy_cache_key $uri;            # Ключ кэша — URI без query string

        # Заголовки для отладки
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key $uri always;

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Не передавать заголовки авторизации в MinIO (bucket public read)
        proxy_set_header Authorization "";

        # Корректная передача Host (MinIO проверяет)
        proxy_set_header Host $host;
    }

    # ── Health check ───────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
