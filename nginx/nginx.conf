# Nginx — CDN эмуляция для отчётов BionicPRO
proxy_cache_path /var/cache/nginx/cdn
    levels=1:2
    keys_zone=cdn_cache:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;

server {
    listen 80;

    location /cdn/ {
        rewrite ^/cdn/(.*)$ /$1 break;
        proxy_pass http://minio:9000;

        # Кеш
        proxy_cache          cdn_cache;
        proxy_cache_valid    200 7d;
        proxy_cache_valid    404 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock     on;

        add_header X-Cache-Status $upstream_cache_status;

        add_header Cache-Control "public, max-age=3600";
    }

    location /cache/invalidate {
        allow 172.0.0.0/8;
        deny all;

        proxy_cache_bypass 1;
        proxy_no_cache     1;
        return 200 "Cache invalidation: purge not supported in open Nginx, use proxy_cache_bypass.\n";
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}