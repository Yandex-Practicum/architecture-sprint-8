# Nginx: reverse proxy для CDN — кеширование отчётов из S3 (Minio)
# Проксирование /reports/ в Minio, кеш на диске, CORS для фронта

proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:10m max_size=100m inactive=1d use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location /reports/ {
        # Проксируем в Minio (bucket "reports", path-style)
        proxy_pass http://minio:9000/reports/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache reports_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating;

        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
