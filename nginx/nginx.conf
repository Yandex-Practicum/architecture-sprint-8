# BionicPRO CDN — Nginx reverse proxy with caching for MinIO reports
#
# Cache invalidation strategy:
#   Report S3 keys include the ETL date: reports/{username}/{etl_date}/report.csv
#   After each Airflow run, the reports-api starts writing to a new key,
#   so a fresh CDN path is used automatically. No active purge is required.
#   Old cache entries expire via the `inactive` TTL (24h).

proxy_cache_path /var/cache/nginx/reports
    levels=1:2
    keys_zone=reports_cache:10m
    max_size=500m
    inactive=24h
    use_temp_path=off;

server {
    listen 8100;
    server_name _;

    # Proxy all requests to MinIO S3 API
    location / {
        proxy_pass http://minio:9000;

        # Cache settings
        proxy_cache              reports_cache;
        proxy_cache_key          "$uri";
        proxy_cache_valid        200 1h;
        proxy_cache_use_stale    error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock         on;          # coalesce concurrent requests for same key
        proxy_cache_lock_timeout 5s;

        # Pass through necessary headers
        proxy_set_header Host            $proxy_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;

        # Tell clients how long they can cache the file
        add_header Cache-Control    "public, max-age=3600" always;
        add_header X-Cache-Status   $upstream_cache_status always;

        # Allow cross-origin downloads (frontend may be on a different origin)
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }
}
