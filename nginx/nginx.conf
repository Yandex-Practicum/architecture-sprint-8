proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location /reports/ {
        proxy_pass http://minio:9000/bionicpro-reports/reports/;
        proxy_cache reports_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
