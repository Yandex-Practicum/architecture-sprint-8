proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;

    location /reports/ {
        proxy_pass http://minio:9000/reports/;
        proxy_cache reports_cache;
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }
}