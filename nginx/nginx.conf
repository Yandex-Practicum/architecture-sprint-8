events {
    worker_connections 1024;
}

http {
    # Настройки кеширования
    proxy_cache_path /tmp/nginx_cache
                     levels=1:2
                     keys_zone=cdn_cache:100m
                     max_size=10g
                     inactive=60m
                     use_temp_path=off;

    # Формат логов
    log_format cache_status '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'CACHE=$upstream_cache_status';

    access_log /var/log/nginx/access.log cache_status;
    error_log /var/log/nginx/error.log warn;

    upstream minio_upstream {
        server minio:9000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Кеширование для статических отчётов
        location ~ ^/reports/(.*)\.(json|xml|csv)$ {
            proxy_pass http://minio_upstream/reports-bucket/$1.$2;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Настройки кеширования
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 60m;           # Кешировать успешные ответы 60 минут
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Добавление заголовка о статусе кеша
            add_header X-Cache-Status $upstream_cache_status;

            # Для длительного кеширования на клиенте
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Прямые запросы к MinIO (без кеша)
        location /minio/ {
            proxy_pass http://minio_upstream/;
            proxy_set_header Host $host;
        }
    }
}