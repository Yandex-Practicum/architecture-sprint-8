server:
  port: 8000

bionicpro:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth-internal-url: ${AUTH_INTERNAL_URL:http://bionicpro-auth:8081}
  clickhouse-url: ${CLICKHOUSE_URL:http://clickhouse:8123}
  # Задание 4 cutover: customer_mart_v2 is fed by CDC (customers_cdc) joined against
  # Airflow's telemetry_agg, replacing the Задание 2 customer_mart that Airflow used
  # to populate directly via a bulk CRM read.
  mart-table: ${MART_TABLE:reports.customer_mart_v2}
  s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
  s3-access-key: ${S3_ACCESS_KEY:minio_user}
  s3-secret-key: ${S3_SECRET_KEY:minio_password}
  s3-bucket: ${S3_BUCKET:bionicpro-reports}
  cdn-base-url: ${CDN_BASE_URL:http://localhost:8090}
