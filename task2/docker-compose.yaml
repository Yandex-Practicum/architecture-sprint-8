
services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HEAP_OPTS: -Xmx1024m -Xms512m
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_SSL_REQUIRED: none
      KC_IMPORT_STRATEGY: OVERWRITE_EXISTING
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - ldap
      - keycloak_db
  ldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom.ldif:ro
    ports:
      - "389:389"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8081
  bionicpro-auth:
    build:
      context: ./backend/bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - keycloak

  reports_api:
    build:
      context: ./backend/reports_api
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      OLAP_DB_HOST: host.docker.internal
      OLAP_DB_PORT: 5435
      OLAP_DB_NAME: olap
      OLAP_DB_USER: olap_user
      OLAP_DB_PASSWORD: olap_password
    depends_on:
      - olap_db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "8001:5540"
    depends_on:
      - redis
    environment:
      - RIHOSTS=local:redis:6379
  olap_db:
    image: postgres:14
    environment:
      POSTGRES_DB: olap
      POSTGRES_USER: olap_user
      POSTGRES_PASSWORD: olap_password
    volumes:
      - olap_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
  airflow_init:
    image: apache/airflow:2.7.0-python3.9
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: '46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho='
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    depends_on:
      - airflow_db
    entrypoint: ["sh", "-c"]
    command: "airflow db migrate && airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@example.com || true"
  airflow_webserver:
    image: apache/airflow:2.7.0-python3.9
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: '46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho='
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONN_OLAP_CONN: postgresql://olap_user:olap_password@olap_db:5432/olap
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8082:8080"
    depends_on:
      - airflow_db
      - airflow_init
    command: webserver
  airflow_scheduler:
    image: apache/airflow:2.7.0-python3.9
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: '46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho='
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONN_OLAP_CONN: postgresql://olap_user:olap_password@olap_db:5432/olap
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    depends_on:
      - airflow_db
      - airflow_init
    command: scheduler

volumes:
  airflow_db_data:
  olap_db_data:

